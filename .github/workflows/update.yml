# データ（PokeAPI・Pokémon Showdown）を取り直して作り直し、実ブラウザで検証してから GitHub Pages に公開する。
# 検証に1つでも失敗したら公開しない（前回の公開がそのまま残る）。
name: データを更新して公開

on:
  schedule:
    - cron: "0 18 * * 0"          # 毎週月曜 3:00（日本時間）
  workflow_dispatch:
    inputs:
      ps_ref:
        description: "Pokémon Showdown のコミットやタグ（空なら最新）"
        required: false
        default: ""
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write                   # DATA_VERSIONS.json の更新を記録するため
  pages: write
  id-token: write

concurrency:
  group: update-and-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PS_DIR: ${{ github.workspace }}/../pokemon-showdown
      PS_REF: ${{ inputs.ps_ref || vars.PS_REF || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            battle/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係を入れる
        run: |
          npm ci
          npm ci --prefix battle
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Pokémon Showdown を取得
        run: |
          git clone --filter=blob:none https://github.com/smogon/pokemon-showdown "$PS_DIR"
          if [ -n "$PS_REF" ]; then git -C "$PS_DIR" checkout "$PS_REF"; fi
          echo "Showdown: $(git -C "$PS_DIR" log -1 --format='%h %cI')"

      - name: 作る（図鑑・バトル）
        run: bash scripts/build_all.sh

      - name: 実ブラウザで検証する
        run: bash scripts/verify_all.sh

      - name: 公開用にまとめる
        run: python scripts/assemble_site.py

      - name: 失敗したときの画面を保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            shots/
            battle/shots/
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

      - name: 使ったデータの版を記録する（リポジトリに動きがあると、定期実行が止められにくくなる）
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          git add DATA_VERSIONS.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add DATA_VERSIONS.json
            git commit -m "データを更新（$(date -u +%Y-%m-%d)）"
            git push
          fi

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
